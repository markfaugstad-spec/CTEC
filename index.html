function dTi(){draw(ti,(x,w,h)=>{bg(x,w,h,'rgba(30,20,10,.93)','#fb923c');txt(x,G.T1,40,18,w-80,76,'#fb923c','center');txt(x,G.T2,40,112,w-80,84,'#fff','center')})}
const CC=['#f97316','#3b82f6','#a855f7'],SH=['●','▲','■'];
function dCd(){cd.forEach((c,i)=>{const o=G.o&&G.o[i];c.visible=!!o;if(!o)return;const pk=G.ph=='pick'||G.ph=='result',sel=pk&&G.sel==i,lk=G.ph=='result'&&sel;draw(c,(x,w,h)=>{bg(x,w,h,sel?'#fff7ed':'rgba(15,23,42,.94)',lk?'#22c55e':sel?'#facc15':pk?CC[i]:'#64748b');const dk=sel;if(pk)txt(x,SH[i]+' '+(i+1),30,20,w-60,96,CC[i]);let y=txt(x,o[0],30,pk?130:30,w-60,76,dk?'#111':'#fff');txt(x,o[1],30,y+8,w-60,66,dk?'#333':'#cbd5e1',undefined,0);if(lk)txt(x,'✔ LOCKED IN',30,h-100,w-60,70,'#16a34a')})})}
function dTk(){draw(tk,(x,w,h)=>{bg(x,w,h,'rgba(5,46,22,.94)','#4ade80');let y=txt(x,G.K1,40,26,w-80,76,'#4ade80');y=txt(x,G.K2,40,y+14,w-80,82,'#fff');if(G.K3)txt(x,G.K3,40,y+18,w-80,70,'#fde68a',undefined,0)})}
const L=[];const log=s=>{L.unshift(s);L.length=Math.min(L.length,9);dDb()};
function dDb(){if(db)draw(db,(x,w,h)=>{bg(x,w,h,'rgba(0,0,0,.85)','#f0f');txt(x,`DEBUG ${G.ph} step ${G.i} UI ${UI.toFixed(2)} fps ${fps|0}`,20,14,w-40,44,'#f0f');L.forEach((l,i)=>txt(x,l,20,70+i*50,w-40,40,'#0f0',undefined,0))})}
function dAll(){dBar();dSb();dBr();dTi();dCd();dTk();dDb()}

function lock(){const s=steps[G.i],o=s.o[G.sel],f=[...o[2]];G.ex='';
 if(s.rb&&V[0]>=150){f[1]+=5;G.pts.p=(G.pts.p||0)+2;G.ex='Your reserve helped! 😊 +5'}
 V[0]=Math.max(0,V[0]+f[0]+f[3]);V[3]+=f[3];[1,2,4].forEach(i=>V[i]=Math.max(0,Math.min(100,V[i]+f[i])));
 const p=par(o[3]);for(const k in p)G.pts[k]=(G.pts[k]||0)+p[k];
 G.chips=[['💷',f[0],'£'],['😊',f[1],''],['⭐',f[2],''],['🛒',f[3],'£'],['🤝',f[4],'']].filter(a=>a[1]).map(a=>a[0]+' '+(a[1]>0?'+':'−')+a[2]+Math.abs(a[1])).join('   ');
 G.ph='result';snd(0,f[1]+f[2]+f[3]>=0?784:220,.5);snd(C3,f[1]>=0?660:200,.4)}
function nextStep(){const nx=steps[G.i+1];if(!nx||nx.first){G.pts.t=(G.pts.t||0)+G.tk.reduce((a,b)=>a+b,0);G.tk=[0,0,0]}
 if(!nx){G.ph='end';snd(0,880,.6);return}G.i++;G.sel=-1;G.ph=nx.first?'brief':'pick';if(G.ph=='pick'){G.tm=nx.T||0;G.lt=-1}else evSnd()}
function enter(){const ph=G.ph;
 if(ph=='intro'){G.i=0;G.ph='brief';evSnd()}
 else if(ph=='brief'){G.ph='pick';G.tm=steps[G.i].T||0;G.lt=-1}
 else if(ph=='pick'){if(G.sel<0){snd(0,200,.3);speak('Choose an option first.');return}lock()}
 else if(ph=='result')nextStep();else G.dq++;
 render()}
function pickOpt(i){if(G.ph!='pick'||!steps[G.i].o[i])return;G.sel=i;snd(0,520+i*100,.12);render(0);speak(steps[G.i].o[i][0]+'. '+steps[G.i].o[i][1].replace('\n','. '))}

/* ---------- input (keyboard + mouse; no controllers needed) ---------- */
const lay=()=>{rot.rotation.y=-(window.YAW||0)*Math.PI/180;pan.forEach(p=>p.scale.setScalar(UI))};
addEventListener('keydown',e=>{const k=e.key;if(Q)log('key '+k);if(k==' '||k.startsWith('Arrow'))e.preventDefault();
 if(k>='1'&&k<='3')pickOpt(+k-1);else if(k=='ArrowRight')pickOpt(((G.sel<0?-1:G.sel)+1)%3);else if(k=='ArrowLeft')pickOpt(((G.sel<0?1:G.sel)+2)%3);
 else if(k=='Enter'||k==' ')enter();
 else if('qwe'.includes(k)&&k.length==1){const i='qwe'.indexOf(k);G.tk[i]^=1;snd(0,990,.1);render(0)}
 else if(k=='r'||k=='R')speak(G.say);else if(k=='m'||k=='M'){G.voice^=1;speechSynthesis.cancel()}
 else if(k=='p'||k=='P')G.pz^=1;else if(k=='t'||k=='T'){G.tm+=30;G.lt=-1}
 else if(k=='['||k==']'){window.YAW=(window.YAW||0)+(k=='['?-1:1);lay()}
 else if(k=='-'||k=='='||k=='+'){UI=Math.max(.6,Math.min(1.6,UI+(k=='-'?-.05:.05)));lay();dDb()}
 else if(k=='ArrowUp'||k=='ArrowDown'){HN+=k=='ArrowUp'?-.05:.05}});
const rc=new THREE.Raycaster();let dn=null;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{dn=[e.clientX,e.clientY];if(Q)log('ptr down')});
cv.addEventListener('pointermove',e=>{if(e.buttons&1&&!renderer.xr.isPresenting){cam.rotation.y-=e.movementX*.004;cam.rotation.x=Math.max(-1,Math.min(1,cam.rotation.x-e.movementY*.004))}});
cv.addEventListener('pointerup',e=>{if(!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;rc.setFromCamera({x:e.clientX/innerWidth*2-1,y:-e.clientY/innerHeight*2+1},cam);const h=rc.intersectObjects(cd.filter(c=>c.visible))[0];
 if(h){const i=cd.indexOf(h.object);if(G.ph=='pick'&&G.sel==i)enter();else pickOpt(i)}});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

/* ---------- loop ---------- */
const clock=new THREE.Clock();let fps=60,t0=0,ey=0;
render(0);lay();
renderer.setAnimationLoop(()=>{const dt=Math.min(.1,clock.getDelta());fps+=(1/dt-fps)*.05;t0+=dt;
 if(renderer.xr.isPresenting&&CAL<30){const v=new THREE.Vector3();renderer.xr.getCamera().getWorldPosition(v);ey+=v.y;if(++CAL==30)world.position.y=ey/30-1.6}
 if(CAL<30&&!renderer.xr.isPresenting)CAL=0,ey=0;
 world.position.y=(CAL>=30?ey/30-1.6:0)+HN;
 const s=steps[G.i],surge=G.ph!='intro'&&s.r==3&&!G.end?24:0,n=Math.min(48,3+Math.floor(V[1]/12)+surge);
 while(cust.length<n)cust.push(mkC());
 cust.forEach((c,i)=>{c.visible=i<n;const u=c.userData;u.a+=u.v*dt*(surge?1.8:1);if(u.a>172||u.a<HALF+8)u.v*=-1;c.position.set(...polar(u.r,u.a,Math.abs(Math.sin(t0*5+u.ph))*.05))});
 if(G.ph=='pick'&&s.T&&!G.pz&&G.tm>0){G.tm-=dt;const c=Math.ceil(G.tm);if(c!=G.lt){G.lt=c;dBar();if(G.tm<=0){snd(0,300,.8);snd(C1,300,.8);snd(C3,300,.8)}}}
 renderer.render(scene,renderer.xr.isPresenting?cam:cam)});
</script></body></html>
